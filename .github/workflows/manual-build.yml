name: Manual APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify Xposed configuration
        run: python3 .github/scripts/verify_xposed.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName from app/build.gradle"
            exit 1
          fi
          COMMIT_SHA="${GITHUB_SHA::7}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mt8163_tools_${{ steps.version.outputs.name }}_${{ steps.version.outputs.commit }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MT8163Tools_${{ steps.version.outputs.name }}_${{ steps.version.outputs.commit }}
          path: dist/mt8163_tools_${{ steps.version.outputs.name }}_${{ steps.version.outputs.commit }}.apk
          if-no-files-found: error
          retention-days: 14
