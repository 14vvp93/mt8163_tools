name: UI Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-ui-preview:
    name: Capture native Android UI and build HTML preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Capture screens on Android 9 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p ui-preview/screens
            adb shell wm size 1280x720
            adb shell wm density 160
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.mt8163.tools/.ui.MainActivity
            sleep 3

            adb exec-out screencap -p > ui-preview/screens/events.png

            adb shell input tap 140 132
            adb shell input tap 1216 40
            sleep 1
            adb exec-out screencap -p > ui-preview/screens/media.png

            adb shell input tap 140 212
            adb shell input tap 1216 40
            sleep 1
            adb exec-out screencap -p > ui-preview/screens/protection.png

            adb shell input tap 140 292
            adb shell input tap 1216 40
            sleep 1
            adb exec-out screencap -p > ui-preview/screens/voltage.png

            adb shell input tap 140 372
            adb shell input tap 1216 40
            sleep 1
            adb exec-out screencap -p > ui-preview/screens/autorun.png

      - name: Build standalone HTML preview
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          screens = [
              ("Events", "events"),
              ("Media", "media"),
              ("Protection", "protection"),
              ("Voltage", "voltage"),
              ("Autorun", "autorun"),
          ]

          buttons = []
          sections = []
          for index, (title, key) in enumerate(screens):
              image = Path(f"ui-preview/screens/{key}.png")
              if not image.is_file():
                  raise SystemExit(f"Missing native screenshot: {image}")
              encoded = base64.b64encode(image.read_bytes()).decode("ascii")
              active = " active" if index == 0 else ""
              hidden = "" if index == 0 else " hidden"
              buttons.append(
                  f'<button class="tab{active}" data-screen="{key}">{title}</button>'
              )
              sections.append(
                  f'<section class="screen{hidden}" id="screen-{key}">'
                  f'<img src="data:image/png;base64,{encoded}" '
                  f'alt="{title} screen captured from the Android app">'
                  f'</section>'
              )

          html = """<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>MT8163 Tools — Native UI Preview</title>
          <style>
          *{box-sizing:border-box}
          html,body{margin:0;min-height:100%;background:#090a0c;color:#f1f2f4;
            font-family:Arial,Helvetica,sans-serif}
          body{display:flex;flex-direction:column;align-items:center;padding:18px}
          .top{width:min(1280px,100%);display:flex;align-items:center;gap:18px;
            flex-wrap:wrap;margin-bottom:14px}
          h1{font-size:18px;margin:0;font-weight:700}
          .tabs{display:flex;gap:6px;flex-wrap:wrap}
          .tab{border:1px solid #343840;background:#17191d;color:#aeb2ba;
            padding:9px 15px;border-radius:4px;font-size:14px;cursor:pointer}
          .tab.active{background:#ff3348;border-color:#ff3348;color:white}
          .frame{width:min(1280px,100%);aspect-ratio:16/9;background:#111316;
            box-shadow:0 12px 48px #0009;overflow:hidden}
          .screen{width:100%;height:100%}
          .screen[hidden]{display:none}
          img{display:block;width:100%;height:100%;object-fit:contain}
          .note{width:min(1280px,100%);color:#858a94;font-size:12px;margin-top:10px}
          </style>
          </head>
          <body>
          <header class="top"><h1>MT8163 Tools · Native Android UI</h1>
          <nav class="tabs">""" + "".join(buttons) + """</nav></header>
          <main class="frame">""" + "".join(sections) + """</main>
          <p class="note">Screens captured from the app on Android 9 (API 28), 1280×720,
          160 dpi. The screenshots show native Android rendering.</p>
          <script>
          document.querySelectorAll(".tab").forEach(button=>{
            button.addEventListener("click",()=>{
              document.querySelectorAll(".tab").forEach(item=>item.classList.remove("active"));
              document.querySelectorAll(".screen").forEach(item=>item.hidden=true);
              button.classList.add("active");
              document.getElementById("screen-"+button.dataset.screen).hidden=false;
            });
          });
          </script>
          </body></html>"""

          Path("mt8163-tools-ui-preview.html").write_text(html, encoding="utf-8")
          PY

      - name: Upload HTML preview
        uses: actions/upload-artifact@v7
        with:
          name: mt8163-tools-ui-preview
          path: mt8163-tools-ui-preview.html
          if-no-files-found: error
          retention-days: 14
