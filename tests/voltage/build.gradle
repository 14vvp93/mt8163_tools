plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'com.mt8163.tools.tests.voltage'
    compileSdk 35

    defaultConfig {
        minSdk 28
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main {
            java {
                setSrcDirs([
                        "../../app/src/main/java/com/mt8163/tools/modules/voltage",
                        "../../app/src/main/java/com/mt8163/tools/core"
                ])
                include "VoltageSettingsStore.java", "EventLogger.java"
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
