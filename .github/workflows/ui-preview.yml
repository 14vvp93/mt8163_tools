name: UI Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-ui-preview:
    name: Generate responsive HTML preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Generate standalone HTML
        shell: bash
        run: |
          cat > mt8163-tools-ui-preview.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#111316">
            <title>MT8163 Tools — UI Preview</title>
            <style>
              :root {
                color-scheme: dark;
                --app: #111316;
                --sidebar: #15171a;
                --header: #17191d;
                --panel: #1b1d22;
                --line: #2b2e34;
                --accent: #ff3348;
                --primary: #f1f2f4;
                --secondary: #aeb2ba;
                --muted: #858a94;
                --green: #63d69a;
                --orange: #ffb45c;
              }
              * { box-sizing: border-box; }
              html, body { margin: 0; min-height: 100%; background: #090a0c; color: var(--primary); font-family: Arial, Helvetica, sans-serif; }
              body { overflow: auto; }
              button, input { font: inherit; }
              .stage { width: 100%; min-height: 100vh; padding: 0; display: flex; justify-content: center; align-items: flex-start; }
              .app { width: min(1280px, 100%); min-width: 860px; height: 720px; min-height: 640px; display: grid; grid-template-columns: 280px minmax(0, 1fr); background: var(--app); border: 1px solid #25282e; overflow: hidden; box-shadow: 0 16px 55px #0009; }
              .sidebar { min-width: 0; padding: 24px 20px 18px; background: var(--sidebar); display: flex; flex-direction: column; }
              .brand { height: 72px; display: flex; align-items: center; padding-left: 8px; flex: 0 0 auto; }
              .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: white; font-size: 16px; font-weight: 800; }
              .brand-copy { padding-left: 14px; }
              .brand-name { font-size: 17px; font-weight: 800; letter-spacing: .2px; }
              .brand-sub { margin-top: 3px; color: var(--muted); font-size: 11px; letter-spacing: .55px; }
              .nav { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
              .nav-item { width: 100%; height: 72px; padding: 0 12px; display: flex; align-items: center; gap: 14px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--secondary); text-align: left; cursor: pointer; }
              .nav-item:hover { background: #1b1e23; }
              .nav-item.active { background: #242127; border-color: #3b2930; color: var(--primary); }
              .nav-icon { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 5px; background: #202329; color: var(--secondary); font-size: 22px; }
              .nav-item.active .nav-icon { background: #392127; color: var(--accent); }
              .nav-name { flex: 1; font-size: 16px; font-weight: 700; }
              .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
              .workspace { min-width: 0; display: flex; flex-direction: column; }
              .header { height: 80px; flex: 0 0 80px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--header); }
              .header-title { font-size: 24px; font-weight: 700; }
              .header-status { margin-top: 4px; color: var(--muted); font-size: 15px; }
              .header-switch { position: relative; width: 52px; height: 30px; flex: 0 0 auto; }
              .header-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
              .track { position: absolute; inset: 3px 0; border-radius: 20px; background: #555b65; pointer-events: none; transition: background .15s; }
              .track:after { content: ""; position: absolute; width: 24px; height: 24px; top: 0; left: 0; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0008; transition: transform .15s; }
              .header-switch input:checked + .track { background: var(--accent); }
              .header-switch input:checked + .track:after { transform: translateX(24px); }
              .content { min-height: 0; flex: 1; overflow: auto; background: var(--app); }
              .module { min-height: 100%; }
              .module[hidden] { display: none; }
              .disabled { display: none; min-height: 100%; padding: 28px; align-items: center; justify-content: center; text-align: center; }
              .disabled.visible { display: flex; }
              .disabled-card { padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
              .disabled-title { font-size: 18px; font-weight: 700; }
              .disabled-copy { margin-top: 10px; color: var(--muted); font-size: 15px; }
              .scroll-layout { min-height: 100%; padding: 36px; }
              .eyebrow { color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: .12em; }
              .module-title { margin: 12px 0 0; color: var(--primary); font-size: 30px; line-height: 1.2; }
              .description { margin: 12px 0 0; color: var(--muted); font-size: 18px; line-height: 1.45; }
              .media-layout { padding: 36px; }
              .media-layout .module-title { margin-top: 12px; }
              .field-label { margin-top: 24px; color: var(--muted); font-size: 15px; }
              .field-value { margin-top: 6px; color: var(--primary); font-size: 22px; overflow-wrap: anywhere; }
              .state-value { font-size: 26px; font-weight: 700; }
              .raw-state { margin-top: 8px; color: var(--muted); font-size: 14px; }
              .separator { height: 1px; margin-top: 24px; background: var(--line); }
              .section-label { margin-top: 18px; color: var(--accent); font-size: 14px; letter-spacing: .08em; }
              .setting-row { min-height: 76px; margin-top: 14px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line); }
              .setting-copy { flex: 1; min-width: 0; }
              .setting-title { font-size: 18px; }
              .setting-description { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.4; }
              .small-switch { width: 44px; height: 26px; position: relative; flex: 0 0 auto; }
              .small-switch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
              .small-switch span { position: absolute; inset: 2px 0; border-radius: 20px; background: #555b65; pointer-events: none; }
              .small-switch span:after { content: ""; position: absolute; width: 22px; height: 22px; left: 0; top: 0; border-radius: 50%; background: white; transition: transform .15s; }
              .small-switch input:checked + span { background: var(--accent); }
              .small-switch input:checked + span:after { transform: translateX(22px); }
              .voltage-layout { min-height: 100%; padding: 24px; display: flex; flex-direction: column; }
              .voltage-layout .module-title { margin-top: 6px; }
              .voltage-layout .description { margin-top: 6px; font-size: 17px; }
              .voltage-panel { flex: 1; min-height: 360px; margin-top: 22px; padding: 24px 32px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; border-radius: 5px; background: var(--panel); }
              .panel-label { text-align: center; color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: .1em; }
              .voltage-value { margin-top: 10px; text-align: center; font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }
              .range { width: 100%; height: 42px; margin: 18px 0 0; accent-color: var(--accent); cursor: pointer; }
              .range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 15px; }
              .range-labels span:nth-child(2) { color: var(--secondary); font-weight: 700; }
              .step-label { margin-top: 14px; text-align: center; color: var(--muted); font-size: 14px; }
              .reset { height: 64px; margin-top: 24px; border: 1px solid var(--line); border-radius: 4px; background: var(--header); color: var(--primary); font-size: 18px; cursor: pointer; }
              .reset:hover { border-color: #555b65; }
              .events-layout { min-height: 100%; padding: 20px 28px 16px; display: flex; flex-direction: column; }
              .event-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; height: 64px; flex: 0 0 64px; }
              .action-button, .filter-button { min-width: 0; border: 1px solid #383c44; border-radius: 4px; background: #202329; color: var(--primary); font-size: 15px; cursor: pointer; }
              .action-button:hover, .filter-button:hover { background: #292d34; }
              .filter-button { height: 60px; margin-top: 12px; text-align: left; padding: 0 16px; font-size: 16px; }
              .event-count { padding: 12px 6px; color: #d3d3d3; font-size: 14px; }
              .event-list { flex: 1; min-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; background: #0e1013; }
              .empty-events { min-height: 220px; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; font-size: 14px; }
              .footer-note { padding: 10px 2px 0; color: var(--muted); font-size: 11px; }
              @media (max-width: 900px) {
                .stage { padding: 0; justify-content: flex-start; }
                .app { border: 0; }
              }
              @media (max-height: 680px) {
                .stage { padding-top: 0; padding-bottom: 0; }
              }
            </style>
          </head>
          <body>
            <div class="stage">
              <div class="app">
                <aside class="sidebar">
                  <div class="brand">
                    <div class="brand-mark">MT</div>
                    <div class="brand-copy">
                      <div class="brand-name">MT8163 TOOLS</div>
                      <div class="brand-sub">SYSTEM CONTROL PANEL</div>
                    </div>
                  </div>
                  <nav class="nav" aria-label="Modules">
                    <button class="nav-item" data-module="media"><span class="nav-icon">♫</span><span class="nav-name">Media</span><span class="nav-dot" hidden></span></button>
                    <button class="nav-item" data-module="protection"><span class="nav-icon">◇</span><span class="nav-name">Protection</span><span class="nav-dot" hidden></span></button>
                    <button class="nav-item" data-module="voltage"><span class="nav-icon">ϟ</span><span class="nav-name">Voltage</span><span class="nav-dot" hidden></span></button>
                    <button class="nav-item" data-module="autorun"><span class="nav-icon">↗</span><span class="nav-name">Autorun</span><span class="nav-dot" hidden></span></button>
                    <button class="nav-item active" data-module="events"><span class="nav-icon">≋</span><span class="nav-name">Events</span><span class="nav-dot"></span></button>
                  </nav>
                </aside>

                <section class="workspace">
                  <header class="header">
                    <div>
                      <div class="header-title" id="header-title">Events</div>
                      <div class="header-status" id="header-status">Module enabled</div>
                    </div>
                    <label class="header-switch" aria-label="Enable module">
                      <input id="module-toggle" type="checkbox" checked>
                      <span class="track"></span>
                    </label>
                  </header>

                  <main class="content">
                    <div class="disabled" id="disabled-overlay">
                      <div class="disabled-card">
                        <div class="disabled-title">MODULE DISABLED</div>
                        <div class="disabled-copy">Enable this module using the switch above</div>
                      </div>
                    </div>

                    <section class="module events-layout" data-panel="events">
                      <div class="event-actions">
                        <button class="action-button" data-event-action="refresh">Оновити</button>
                        <button class="action-button" data-event-action="copy">Копіювати</button>
                        <button class="action-button" data-event-action="clear">Очистити</button>
                        <button class="action-button" data-event-action="export">Експорт</button>
                      </div>
                      <button class="filter-button" id="event-filter">Усі модулі&nbsp; ▾</button>
                      <div class="event-count">0 завантажено · втрачено 0 · максимум 10000</div>
                      <div class="event-list"><div class="empty-events">Журнал подій порожній</div></div>
                      <div class="footer-note">Preview controls are visual only; no Android settings or event data are changed.</div>
                    </section>

                    <section class="module media-layout" data-panel="media" hidden>
                      <div class="eyebrow">MEDIA</div>
                      <h1 class="module-title">Audio Source</h1>
                      <div class="field-label">Source package</div>
                      <div class="field-value">Unknown</div>
                      <div class="field-label">Playback state</div>
                      <div class="field-value state-value">UNKNOWN</div>
                      <div class="raw-state">Raw state: unavailable</div>
                      <div class="field-label">Window focus</div>
                      <div class="field-value state-value">NOT FOREGROUND</div>
                      <div class="separator"></div>
                      <div class="section-label">BACKGROUND RESTORE</div>
                      <div class="setting-row">
                        <div class="setting-copy">
                          <div class="setting-title">Restore background media player</div>
                          <div class="setting-description">Open the media app when it was in the background</div>
                        </div>
                        <label class="small-switch"><input type="checkbox"><span></span></label>
                      </div>
                      <div class="setting-row">
                        <div class="setting-copy">
                          <div class="setting-title">Restore background Bluetooth player</div>
                          <div class="setting-description">Open Bluetooth music when it was in the background</div>
                        </div>
                        <label class="small-switch"><input type="checkbox"><span></span></label>
                      </div>
                    </section>

                    <section class="module scroll-layout" data-panel="protection" hidden>
                      <div class="eyebrow">PROTECTION</div>
                      <h1 class="module-title">Protection</h1>
                      <p class="description">Модуль налаштування захисту системи.</p>
                    </section>

                    <section class="module voltage-layout" data-panel="voltage" hidden>
                      <div class="eyebrow">VOLTAGE</div>
                      <h1 class="module-title">Voltage Offset</h1>
                      <p class="description">Adjust the voltage reported by the MCU</p>
                      <div class="voltage-panel">
                        <div class="panel-label">CURRENT CORRECTION</div>
                        <output class="voltage-value" id="voltage-value">+0.0 V</output>
                        <input class="range" id="voltage-range" type="range" min="-20" max="20" step="1" value="0" aria-label="Voltage correction">
                        <div class="range-labels"><span>−2.0 V</span><span>0.0 V</span><span>+2.0 V</span></div>
                        <div class="step-label">STEP&nbsp; 0.1 V</div>
                        <button class="reset" id="voltage-reset">Reset to 0.0 V</button>
                      </div>
                    </section>

                    <section class="module scroll-layout" data-panel="autorun" hidden>
                      <div class="eyebrow">AUTORUN</div>
                      <h1 class="module-title">Autorun</h1>
                      <p class="description">Модуль керування автоматичним запуском.</p>
                    </section>
                  </main>
                </section>
              </div>
            </div>

            <script>
              const modules = ["media", "protection", "voltage", "autorun", "events"];
              const names = {media:"Media", protection:"Protection", voltage:"Voltage", autorun:"Autorun", events:"Events"};
              const enabled = Object.fromEntries(modules.map(id => [id, true]));
              let selected = "events";

              function renderModule() {
                document.querySelectorAll("[data-module]").forEach(button => {
                  const active = button.dataset.module === selected;
                  button.classList.toggle("active", active);
                  button.querySelector(".nav-dot").hidden = !enabled[button.dataset.module];
                });
                document.querySelectorAll("[data-panel]").forEach(panel => {
                  panel.hidden = panel.dataset.panel !== selected;
                });
                document.getElementById("header-title").textContent = names[selected];
                document.getElementById("header-status").textContent = enabled[selected] ? "Module enabled" : "Module disabled";
                document.getElementById("module-toggle").checked = enabled[selected];
                document.getElementById("disabled-overlay").classList.toggle("visible", !enabled[selected]);
                document.querySelectorAll("[data-panel]").forEach(panel => {
                  panel.style.display = panel.dataset.panel === selected && enabled[selected] ? "" : "none";
                });
              }

              document.querySelectorAll("[data-module]").forEach(button => {
                button.addEventListener("click", () => {
                  selected = button.dataset.module;
                  renderModule();
                  document.querySelector(".content").scrollTop = 0;
                });
              });

              document.getElementById("module-toggle").addEventListener("change", event => {
                enabled[selected] = event.target.checked;
                renderModule();
              });

              const range = document.getElementById("voltage-range");
              const value = document.getElementById("voltage-value");
              function updateVoltage() {
                const volts = Number(range.value) / 10;
                value.textContent = (volts > 0 ? "+" : "") + volts.toFixed(1) + " V";
              }
              range.addEventListener("input", updateVoltage);
              document.getElementById("voltage-reset").addEventListener("click", () => {
                range.value = "0";
                updateVoltage();
              });

              document.querySelectorAll("[data-event-action]").forEach(button => {
                button.addEventListener("click", () => {
                  if (button.dataset.eventAction === "clear") {
                    document.querySelector(".empty-events").textContent = "Журнал подій порожній";
                  }
                });
              });
              document.getElementById("event-filter").addEventListener("click", () => {
                document.getElementById("event-filter").textContent = "Усі модулі  ▾";
              });

              renderModule();
            </script>
          </body>
          </html>
          HTML

          test -s mt8163-tools-ui-preview.html
          echo "Generated mt8163-tools-ui-preview.html ($(wc -c < mt8163-tools-ui-preview.html) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML preview
        uses: actions/upload-artifact@v7
        with:
          name: mt8163-tools-ui-preview
          path: mt8163-tools-ui-preview.html
          if-no-files-found: error
          retention-days: 14
