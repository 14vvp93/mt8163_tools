import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'com.android.library' version '8.7.3'
}

android {
    namespace 'com.mt8163.tools.tests.voltage'
    compileSdk 35

    defaultConfig {
        minSdk 28
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.named("compileDebugJavaWithJavac", JavaCompile) {
    source = files(
            "../../app/src/main/java/com/mt8163/tools/modules/voltage/VoltageSettingsStore.java",
            "../../app/src/main/java/com/mt8163/tools/core/EventLogger.java"
    )
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
