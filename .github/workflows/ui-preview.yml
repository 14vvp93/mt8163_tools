name: UI Preview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview source
        type: choice
        options:
          - full
          - reuse
        default: full
        required: true
      source_run_id:
        description: Successful Manual Build run ID (required for reuse)
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-preview:
    name: Android 9 UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Verify Xposed configuration
        run: python3 .github/scripts/verify_xposed.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build app and UI instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Download APK from Manual Build
        if: inputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "A valid Manual Build run ID is required for reuse mode."
            exit 1
          fi

          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          if [[ "$(jq -r '.head_branch' <<< "$RUN_JSON")" != "development" ||
                "$(jq -r '.status' <<< "$RUN_JSON")" != "completed" ||
                "$(jq -r '.conclusion' <<< "$RUN_JSON")" != "success" ]]; then
            echo "The selected run must be a successful completed run on development."
            exit 1
          fi

          ARTIFACT_NAME="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("MT8163Tools_")))] | sort_by(.created_at) | last | .name // empty')"

          if [[ -z "$ARTIFACT_NAME" ]]; then
            echo "No valid APK artifact was found in the selected run."
            exit 1
          fi

          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir dist

          APK_PATH="$(find dist -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "The downloaded artifact does not contain an APK."
            exit 1
          fi

          cp "$APK_PATH" app/build/outputs/apk/debug/app-debug.apk

      - name: Cache Android Virtual Device
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ui-preview-avd-api28-pixel2-${{ runner.os }}

      - name: Run Android 9 emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail

            adb shell wm size 1280x720
            adb shell wm density 160
            adb shell settings put system font_scale 1.0

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm clear com.mt8163.tools

            TEST_OUTPUT="$(adb shell am instrument -w -r \
              -e class com.mt8163.tools.UiPreviewTest \
              com.mt8163.tools.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
            printf '%s\n' "$TEST_OUTPUT"
            grep -q 'OK (1 test)' <<< "$TEST_OUTPUT"

            mkdir -p artifacts/ui-preview
            adb pull /sdcard/Android/data/com.mt8163.tools/files/ui-preview artifacts/ui-preview

            {
              echo "Android API: 28"
              echo "Resolution: 1280x720"
              echo "Density: 160 dpi"
              echo "Source branch: development"
              echo "Source commit: $GITHUB_SHA"
              echo "Preview mode: ${{ inputs.mode }}"
              echo "Capture method: AndroidX UIAutomator instrumentation"
            } > artifacts/ui-preview/preview-info.txt

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v7
        with:
          name: MT8163Tools_UI_Preview_${{ github.run_number }}
          path: artifacts/ui-preview/
          if-no-files-found: error
          retention-days: 14
