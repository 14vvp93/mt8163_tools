name: APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  queue: max

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/development' }}

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionName from app/build.gradle"
            exit 1
          fi
          COMMIT_SHA="${GITHUB_SHA::7}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mt8163_tools_${{ steps.version.outputs.name }}_${{ steps.version.outputs.commit }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MT8163Tools_${{ steps.version.outputs.name }}_${{ steps.version.outputs.commit }}
          path: dist/mt8163_tools_${{ steps.version.outputs.name }}_${{ steps.version.outputs.commit }}.apk
          if-no-files-found: error
          retention-days: 14
