name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  verify:
    name: Android checks (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/development' }}

      - name: Run Android lint and unit tests
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest
